[package]
name = "growl"
version = "0.7.0"
edition = "2021"
description = "Rust bindings for the Growl OWL 2 RL reasoner"
license = "Apache-2.0"
repository = "https://github.com/Trivyn/growl"
keywords = ["owl", "rdf", "reasoner", "ontology", "semantic-web"]
categories = ["science", "algorithms"]
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "csrc/**/*",
    "csrc_shim.c",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
slop-std-sys = { git = "https://github.com/slop-lang/slop-sys", tag = "v0.2.1", version = "0.1.2" }
slop-rdf-sys = { git = "https://github.com/slop-lang/slop-sys", tag = "v0.2.1", version = "0.3.0" }

[build-dependencies]
cc = "1"
